[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "codecortex-network"
version = "0.1.0"
description = "A bounded, evidence-retaining GitHub repository scout."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "httpx>=0.27,<1.0", "pydantic-settings>=2.2,<3.0", "uvicorn[standard]>=0.29,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0", "ruff>=0.4,<1.0", "httpx>=0.27,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ccn"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

